workflows:
  android-apk-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 21
    scripts:
      - name: Generate Required Gradle Version & Keystore & Google Services
        script: |
          # 1. إنشاء ملف google-services.json
          mkdir -p app/src/debug app/src/main app
          cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "auto-build", "storage_bucket": "auto.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:123456789:android:123", "android_client_info": { "package_name": "com.aistudio.novaplayer.ar" } },
              "oauth_client": [], "api_key": [{ "current_key": "mock_key" }], "services": {}
            }],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/debug/ 2>/dev/null || true
          cp app/google-services.json app/src/main/ 2>/dev/null || true

          # 2. إنشاء ملف debug.keystore المفقود تلقائياً
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/ 2>/dev/null || true

          # 3. إنشاء Gradlew بإصدار 9.3.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug \
            -x test \
            --no-daemon \
            --no-configuration-cache
    artifacts:
      - app/build/outputs/apk/**/*.apk
