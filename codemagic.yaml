workflows:
  android-apk-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Create Mock Google Services File
        script: |
          mkdir -p app
          echo '{"project_info":{"project_number":"0","project_id":"app","storage_bucket":"a.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.novaplayer.ar"}},"api_key":[{"current_key":"key"}]}]}' > app/google-services.json

      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x validateSigningDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk

