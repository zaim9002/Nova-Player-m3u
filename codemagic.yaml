workflows:
  android-apk-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Generate Gradle Wrapper & Google Services File
        script: |
          # 1. إنشاء ملف google-services.json تلقائياً
          mkdir -p app/src/debug app/src/main
          cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "auto-build", "storage_bucket": "auto.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:123456789:android:123", "android_client_info": { "package_name": "com.aistudio.novaplayer.ar" } },
              "oauth_client": [], "api_key": [{ "current_key": "mock_key" }], "services": {}
            }],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/debug/ 2>/dev/null || true

          # 2. إنشاء ملف gradlew المفقود تلقائياً
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug \
            -x test \
            -x validateSigningDebug \
            -x processDebugGoogleServices \
            --no-daemon
    artifacts:
      - app/build/outputs/apk/**/*.apk
