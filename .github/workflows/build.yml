name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Mock google-services.json
        run: |
          mkdir -p app/src/debug app/src/main
          cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "auto-build", "storage_bucket": "auto.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:123456789:android:123", "android_client_info": { "package_name": "com.aistudio.novaplayer.ar" } },
              "oauth_client": [], "api_key": [{ "current_key": "mock_key" }], "services": {}
            }],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/debug/ 2>/dev/null || true

      - name: Build Unsigned Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file="" \
            -x validateSigningDebug \
            -x processDebugGoogleServices \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
