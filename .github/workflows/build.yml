name: Smart Auto-Fix & Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Auto-Fix Project Files & Environment
        run: |
          echo "=== 1. Checking & Auto-Generating Gradle Wrapper ==="
          # تثبيت إصدار متوافق واستخراج Gradlew لمنع تعارض Gradle 9.x
          gradle wrapper --gradle-version 8.5 --distribution-type bin
          chmod +x gradlew

          echo "=== 2. Auto-Detecting Package Name ==="
          PKG_NAME=$(grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle* 2>/dev/null || grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || echo "com.aistudio.novaplayer.ar")
          echo "Detected Package: $PKG_NAME"

          echo "=== 3. Auto-Generating Mock google-services.json ==="
          mkdir -p app/src/debug app/src/main
          cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "auto-build", "storage_bucket": "auto.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:123456789:android:123", "android_client_info": { "package_name": "$PKG_NAME" } },
              "oauth_client": [], "api_key": [{ "current_key": "mock_key" }], "services": {}
            }],
            "configuration_version": "1"
          }
          EOF
          cp app/google-services.json app/src/debug/ 2>/dev/null || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            -x test \
            -x lint \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
